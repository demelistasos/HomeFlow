name: Build HomeFlow (Windows και Mac)

# Σε κάθε αλλαγή στο main φτιάχνεται νέα έκδοση (0.1.<αριθμός>).
# Ανεβαίνουν ΔΥΟ χωριστές εκδόσεις στα Releases:
#   v0.1.N      -> Windows (HomeFlow-Windows-0.1.N.zip)
#   mac-v0.1.N  -> Mac     (HomeFlow-Mac-0.1.N.zip)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Εγκατάσταση
        run: npm install

      - name: Αριθμός έκδοσης
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: dist/HomeFlow-*.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Έκδοση για Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          V="0.1.${{ github.run_number }}"
          gh release create "mac-v$V" "out/HomeFlow-Mac-$V.zip" \
            --repo "${{ github.repository }}" \
            --title "HomeFlow $V για Mac" \
            --target "${{ github.sha }}" \
            --latest=false \
            --notes "Κατεβάστε το HomeFlow-Mac-$V.zip, ανοίξτε το και σύρετε το HomeFlow στις Εφαρμογές (στη θέση του παλιού). Δουλεύει σε Apple Silicon και Intel. Τα στοιχεία σας δεν χάνονται."

      - name: Έκδοση για Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="0.1.${{ github.run_number }}"
          gh release create "v$V" "out/HomeFlow-Windows-$V.zip" \
            --repo "${{ github.repository }}" \
            --title "HomeFlow $V για Windows" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Κατεβάστε το HomeFlow-Windows-$V.zip, αποσυμπιέστε το και ανοίξτε το HomeFlow.exe. Αν έχετε παλιά έκδοση, βάλτε τον νέο φάκελο στη θέση του παλιού. Τα στοιχεία σας δεν χάνονται. Οδηγίες στο «ΔΙΑΒΑΣΕ ΜΕ.txt»."
