name: Build HomeFlow (Windows και Mac)

# Σε κάθε αλλαγή στο main φτιάχνεται νέα έκδοση (0.1.<αριθμός>).
# Ανεβαίνει ΜΙΑ έκδοση (v0.1.N) με δύο αρχεία:
#   HomeFlow-Windows-0.1.N.zip  και  HomeFlow-Mac-0.1.N.zip
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Πρώτα οι δοκιμές. Αν αποτύχει έστω και μία, ΔΕΝ φτιάχνεται νέα έκδοση.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Εγκατάσταση εργαλείων δοκιμής
        run: |
          cd tests
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1
          npx playwright install --with-deps chromium
      - name: Μικρές δοκιμές
        run: node tests/unit.test.js
      - name: Δοκιμή οθόνης (όλες οι σελίδες, 3 μεγέθη, φωτεινή και σκούρα)
        run: node tests/ui.test.js

  build:
    needs: test
    strategy:
      # Αν το GitHub δεν έχει ελεύθερο Mac, η έκδοση για Windows βγαίνει κανονικά χωρίς αυτό.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win
            optional: false
          - os: macos-latest
            target: --mac
            optional: true
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Εγκατάσταση
        run: npm install

      - name: Αριθμός έκδοσης
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: dist/HomeFlow-*.zip

  release:
    needs: [test, build]
    if: ${{ always() && needs.test.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Δημοσίευση στα Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          V="0.1.${{ github.run_number }}"
          # Τα Windows είναι υποχρεωτικά. Το Mac μπαίνει μόνο αν χτίστηκε.
          test -f "out/HomeFlow-Windows-$V.zip" || { echo "Λείπει το zip των Windows"; exit 1; }
          FILES=$(cd out && ls HomeFlow-*-"$V".zip)
          # «αποτύπωμα» κάθε zip, για να ελέγχει η εφαρμογή ότι κατέβηκε σωστά
          (cd out && sha256sum $FILES > SHA256SUMS.txt && cat SHA256SUMS.txt)
          gh release create "v$V" $(for f in $FILES; do echo "out/$f"; done) "out/SHA256SUMS.txt" \
            --repo "${{ github.repository }}" \
            --title "HomeFlow $V" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Windows: κατεβάστε το HomeFlow-Windows-$V.zip, αποσυμπιέστε το και ανοίξτε το HomeFlow.exe (οδηγίες στο «ΔΙΑΒΑΣΕ ΜΕ.txt»). Mac: κατεβάστε το HomeFlow-Mac-$V.zip και βάλτε το HomeFlow στις Εφαρμογές. Αν έχετε παλιά έκδοση, βάλτε τη νέα στη θέση της. Τα στοιχεία σας δεν χάνονται."
