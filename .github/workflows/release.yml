name: Build HomeFlow (Windows και Mac)

# Σε κάθε αλλαγή στο main φτιάχνεται νέα έκδοση (0.1.<αριθμός>).
# Ανεβαίνουν ΔΥΟ χωριστές εκδόσεις στα Releases:
#   v0.1.N      -> Windows (η «Latest», από εκεί ενημερώνεται αυτόματα)
#   mac-v0.1.N  -> Mac
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win
          - os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Εγκατάσταση
        run: npm install

      - name: Αριθμός έκδοσης
        shell: bash
        run: npm version "0.1.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build
        run: npx electron-builder ${{ matrix.target }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
            dist/*.dmg

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Έκδοση για Mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ls -la out
          V="0.1.${{ github.run_number }}"
          gh release create "mac-v$V" out/*.dmg \
            --repo "${{ github.repository }}" \
            --title "HomeFlow $V για Mac" \
            --target "${{ github.sha }}" \
            --latest=false \
            --notes "Κατεβάστε το HomeFlow-$V-mac.dmg, ανοίξτε το και σύρετε το HomeFlow στις Εφαρμογές. Δουλεύει σε Apple Silicon και Intel."

      - name: Έκδοση για Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V="0.1.${{ github.run_number }}"
          gh release create "v$V" out/*.exe out/*.exe.blockmap out/latest.yml \
            --repo "${{ github.repository }}" \
            --title "HomeFlow $V για Windows" \
            --target "${{ github.sha }}" \
            --latest \
            --notes "Κατεβάστε το HomeFlow-Setup-$V.exe. Αν είναι ήδη εγκατεστημένο, ενημερώνεται μόνο του."
