<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>HomeFlow</title>
  <link rel="stylesheet" href="css/1-theme.css">
  <link rel="stylesheet" href="css/2-layout.css">
  <link rel="stylesheet" href="css/3-components.css">
  <link rel="stylesheet" href="css/4-print.css">
  <link rel="stylesheet" href="css/5-features.css">
  <link rel="stylesheet" href="css/6-responsive.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.svg" alt="" class="brand-logo">
      <div>
        <div class="brand-name">HomeFlow</div>
        <div class="brand-sub" id="brand-version">Έσοδα &amp; έξοδα σπιτιού</div>
      </div>
    </div>
    <div class="side-tools"><button class="search-btn" data-action="search-open" title="Αναζήτηση παντού"><span>🔍</span><span class="sb-t">Αναζήτηση</span><kbd id="search-kbd">Ctrl K</kbd></button><button class="help-btn" data-action="help-open" title="Βοήθεια: Πώς κάνω…; (F1)" aria-label="Βοήθεια">❓</button></div>
    <nav class="nav" id="nav">
      <button data-page="home" class="active"><span class="ni">🏠</span>Ο μήνας</button>
      <button data-page="list"><span class="ni">📋</span>Κινήσεις</button>
      <button data-page="rent"><span class="ni">🔑</span>Ενοίκια</button>
      <button data-page="money"><span class="ni">💰</span>Χρήματα</button>
      <button data-page="recurring"><span class="ni">🔁</span>Πάγια</button>
      <button data-page="tax"><span class="ni">🏛️</span>Εφορία</button>
      <button data-page="people"><span class="ni">🤝</span>Οφειλές</button>
      <button data-page="cars"><span class="ni">🚗</span>Αυτοκίνητα</button>
      <button data-page="field"><span class="ni">🌱</span>Χωράφι</button>
      <button data-page="year"><span class="ni">📅</span>Η χρονιά</button>
      <button data-page="history"><span class="ni">📈</span>Ιστορικό</button>
      <button data-page="settings"><span class="ni">⚙️</span>Ρυθμίσεις</button>
    </nav>
    <div class="side-actions">
      <button class="btn big expense" data-action="new-expense" title="Νέο έξοδο (Ctrl+E)">−<span class="lbl">&nbsp;Νέο έξοδο</span></button>
      <button class="btn big income" data-action="new-income" title="Νέο έσοδο (Ctrl+I)">+<span class="lbl">&nbsp;Νέο έσοδο</span></button>
    </div>
    <div class="save-state" id="save-state">✓ Όλα αποθηκευμένα</div>
  </aside>

  <main class="main">
    <div id="update-banner" class="update-banner hidden"></div>
    <div id="page"></div>
  </main>

  <div id="modal-root"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="js/core.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/model.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/list.js"></script>
  <script src="js/pages/rent.js"></script>
  <script src="js/pages/money.js"></script>
  <script src="js/reminders.js"></script>
  <script src="js/pages/tax.js"></script>
  <script src="js/pages/people.js"></script>
  <script src="js/pages/cars.js"></script>
  <script src="js/pages/rent-extras.js"></script>
  <script src="js/pages/field.js"></script>
  <script src="js/dialogs/more.js"></script>
  <script src="js/pages/recurring.js"></script>
  <script src="js/dialogs/main.js"></script>
  <script src="js/pages/year.js"></script>
  <script src="js/pages/history.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/features/backup.js"></script>
  <script src="js/features/pin.js"></script>
  <script src="js/features/compare.js"></script>
  <script src="js/features/calendar.js"></script>
  <script src="js/features/policies.js"></script>
  <script src="js/features/attachments.js"></script>
  <script src="js/features/help.js"></script>
  <script src="js/features/search.js"></script>
  <script src="js/form.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/features/excel.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/features/report.js"></script>
  <script src="js/features/monthclose.js"></script>
  <script src="js/events.js"></script>
  <script src="js/features/update.js"></script>
  <script src="js/init.js"></script>
</body>
</html>
